name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure signing
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "::error::Android signing secrets are missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/weather-helper-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/weather-helper-release.jks" \
            >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: npm run android:release

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./version.json').versionName")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: node scripts/verify-apk.mjs artifacts/weather-helper-release.apk

      - name: Upload temporary build
        uses: actions/upload-artifact@v4
        with:
          name: weather-helper-v${{ steps.version.outputs.value }}-build-${{ github.run_number }}
          path: artifacts/weather-helper-release.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Weather Helper v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/weather-helper-release.apk
